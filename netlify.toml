# Archivo de configuración para Netlify

[build]
  # Indica a Netlify que tus funciones están en la carpeta "api"
  functions = "api"

# Esta regla es para que las llamadas a /api/loquesea funcionen correctamente
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Legal pages are part of the app. A direct visit must still load index.html.
[[redirects]]
  from = "/legal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/legal/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/progress"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/progress/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/saved"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/saved/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/academy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/academy/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join/"
  to = "/index.html"
  status = 200

# Le decimos a Netlify que el comando para desarrollo es 'vite'
[dev]
  command = "vite"

# Configuración global de funciones
[functions]
  node_bundler = "esbuild"

# Aplica el timeout a TODAS las funciones
[functions."*"]
  timeout = 26
